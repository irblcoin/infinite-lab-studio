name: Import source

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  BUNDLE_URL: https://litter.catbox.moe/jbk8zk.gz
  BUNDLE_SHA256: 1941daea1312ac30fe3a292e1679fa00e0019252d3ef4b099da5a08ea6dd8037

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch the source bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prefer the copy already attached to the release; fall back to the
          # transfer link used for the first import.
          if ! gh release download v1.0.0 --pattern ils-source.tar.gz --clobber 2>/dev/null; then
            curl -fsSL "$BUNDLE_URL" -o ils-source.tar.gz
          fi
          echo "$BUNDLE_SHA256  ils-source.tar.gz" | sha256sum -c -

      - name: Keep the bundle on the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.0 ils-source.tar.gz --clobber

      - name: Unpack it over the working tree
        run: |
          tar xzf ils-source.tar.gz --strip-components=1
          rm ils-source.tar.gz

      - name: Commit the imported tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'Nothing to import'; exit 0; fi
          git commit -m 'Import the ILS source and homepage assets'
          git push origin HEAD:main
