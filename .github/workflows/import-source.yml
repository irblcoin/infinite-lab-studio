name: Import source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download the source bundle from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.0 --pattern ils-source.tar.gz --clobber

      - name: Unpack it over the working tree
        run: |
          tar xzf ils-source.tar.gz --strip-components=1
          rm ils-source.tar.gz

      - name: Commit the imported tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && echo 'Nothing to import' && exit 0
          git commit -m 'Import the ILS source and homepage assets'
          git push origin HEAD:main
